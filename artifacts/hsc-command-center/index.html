<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>HSC 2027 Command Center</title>
    <meta name="description" content="A private, offline-ready study planner for HSC students. Your study records stay in this browser." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="HSC 2027 Command Center" />
    <meta property="og:description" content="A private, offline-ready study planner for HSC students. Your study records stay in this browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HSC 2027 Command Center" />
    <meta name="twitter:description" content="A private, offline-ready study planner for HSC students. Your study records stay in this browser." />
    <meta name="theme-color" content="#173b4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HSC 2027" />
    <script>
      (() => {
        const configuredBase = "%BASE_URL%";
        const firstPathSegment = window.location.pathname.split("/").filter(Boolean)[0];
        let basePath = configuredBase.startsWith("/")
          ? configuredBase
          : firstPathSegment
            ? "/" + firstPathSegment + "/"
            : "/";
        if (!basePath.endsWith("/")) basePath += "/";
        const base = document.createElement("base");
        base.href = new URL(basePath, window.location.origin).href;
        document.head.prepend(base);
      })();
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/app-icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
